name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: builds + uploads artifacts, no release

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The in-app updater compares CARGO_PKG_VERSION against release tags,
      # so a tag that doesn't match Cargo.toml would ship a lying binary.
      - name: Tag must match Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} != Cargo.toml version $v"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The app links the FFmpeg libraries (ffmpeg-next), so each runner
      # needs them to build and Linux/Windows archives ship them next to the
      # binary. Linux/Windows use BtbN's GPL *shared* builds (pinned to the
      # 8.1 branch; their libav*.so/.dll carry every codec dependency inside),
      # located through FFMPEG_DIR at build time; the Linux binary gets an
      # $ORIGIN rpath so the bundled .so files resolve from the archive.
      # macOS builds against Homebrew's ffmpeg@8 (the plain `ffmpeg` formula
      # is already 9.x) and stays unbundled: it needs `brew install ffmpeg@8`.
      - name: FFmpeg libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev libasound2-dev
          curl -fsSL -o ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz
          mkdir ffshared && tar xf ff.tar.xz -C ffshared --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffshared" >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,--disable-new-dtags' >> "$GITHUB_ENV"
      - name: FFmpeg libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@8 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@8)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: FFmpeg libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip
          7z x ff.zip # Git Bash's GNU tar can't read zip
          mv ffmpeg-n8.1-latest-win64-gpl-shared-8.1 ffshared
          echo "FFMPEG_DIR=${{ github.workspace }}\ffshared" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - run: cargo build --release

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          dir=hikyeah-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$dir"
          cp target/release/hikyeah "$dir/"
          cp ffshared/bin/ffmpeg "$dir/"
          cp -P ffshared/lib/*.so* "$dir/"
          cp ffshared/LICENSE.txt "$dir/FFMPEG-LICENSE.txt"
          echo "Bundled FFmpeg (libraries + ffmpeg binary): GPL shared build from https://github.com/BtbN/FFmpeg-Builds (source: https://ffmpeg.org)" > "$dir/FFMPEG-NOTICE.txt"
          ldd "$dir/hikyeah" | grep -E "libav|libsw" # must resolve inside the archive
          ! ldd "$dir/hikyeah" | grep -q "not found"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"

      # HikYeah.app, the HikViewer way: ad-hoc signed (no Developer ID), so
      # install.sh (curl, no quarantine xattr) is the supported path. The
      # ffmpeg binary sits next to the executable, where stream::ffmpeg_path
      # looks first; ditto keeps the signature intact where zip would not.
      # Resources/AppIcon.icns is HikViewer's icon set (all ten sizes, so
      # Spotlight and the Dock have one at every scale).
      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          dir=hikyeah-${{ github.ref_name }}-${{ matrix.target }}
          app="$dir/HikYeah.app"
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/hikyeah "$app/Contents/MacOS/"
          cp Resources/AppIcon.icns "$app/Contents/Resources/"
          curl -fsSL -A "Mozilla/5.0" -o ff.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          unzip -o ff.zip -d ffdl
          cp ffdl/ffmpeg "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/ffmpeg"
          echo "Bundled ffmpeg binary: GPL build from https://ffmpeg.martin-riedl.de (source: https://ffmpeg.org, license: https://ffmpeg.org/legal.html). The app itself links Homebrew's FFmpeg libraries: brew install ffmpeg@8." > "$dir/FFMPEG-NOTICE.txt"
          printf 'APPL????' > "$app/Contents/PkgInfo"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>HikYeah</string>
            <key>CFBundleDisplayName</key><string>HikYeah</string>
            <key>CFBundleIdentifier</key><string>com.alkait.hikyeah</string>
            <key>CFBundleExecutable</key><string>hikyeah</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>HikYeah connects to your cameras and NVR on the local network.</string>
          </dict></plist>
          PLIST
          codesign --force --sign - --deep "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Identifier|adhoc'
          ditto -c -k --keepParent "$dir" "$dir.app.zip"
          shasum -a 256 "$dir.app.zip" > "$dir.app.zip.sha256"

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dir=hikyeah-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$dir"
          cp target/release/hikyeah.exe "$dir/"
          cp ffshared/bin/ffmpeg.exe ffshared/bin/*.dll "$dir/"
          cp ffshared/LICENSE.txt "$dir/FFMPEG-LICENSE.txt"
          echo "Bundled FFmpeg (libraries + ffmpeg binary): GPL shared build from https://github.com/BtbN/FFmpeg-Builds (source: https://ffmpeg.org)" > "$dir/FFMPEG-NOTICE.txt"
          7z a "$dir.zip" "$dir"
          sha256sum "$dir.zip" > "$dir.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: hikyeah-${{ matrix.target }}
          path: hikyeah-*-${{ matrix.target }}.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The Linux job also ships the installer, so
          # releases/latest/download/install.sh always serves the newest one.
          files: |
            hikyeah-*-${{ matrix.target }}.*
            ${{ runner.os == 'Linux' && 'install.sh' || '' }}
            ${{ runner.os == 'Linux' && 'uninstall.sh' || '' }}
